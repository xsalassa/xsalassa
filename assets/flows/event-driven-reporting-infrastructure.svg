<title id="title">Event-driven reporting infrastructure</title><desc id="description">A manual Cloud Build trigger builds a container image. The distinct runtime path is authenticated Pub/Sub HTTP push to Cloud Run. Optional dead-letter configuration is a capability of the push module.</desc>
