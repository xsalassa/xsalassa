<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 256" role="img" aria-labelledby="title description">
<title id="title">Cross-cloud transfer reliability</title><desc id="description">The worker stages a Google Cloud Storage object on local disk and uploads it to Amazon S3. The flow verifies the destination byte count and cleans up the staged file.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31578b"/></marker></defs>
<rect width="1080" height="256" rx="24" fill="#eef4fb"/>
<text x="30" y="42" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#111827">Cross-cloud transfer reliability</text>
<rect x="30" y="68" width="1020" height="136" rx="13" fill="#f8faff" stroke="#a9bdd4"/>
<text x="50" y="97" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#31578b">Transfer and destination verification</text>
<rect x="50" y="117" width="224" height="65" rx="8" fill="#ffffff" stroke="#879ebe"/>
<text x="62" y="143" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#111827">Google Cloud Storage</text>
<text x="62" y="165" font-family="system-ui,sans-serif" font-size="14" fill="#344966">Source object</text>
<path d="M274 149 h25" stroke="#31578b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="302" y="117" width="224" height="65" rx="8" fill="#ffffff" stroke="#879ebe"/>
<text x="314" y="143" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#111827">Local disk</text>
<text x="314" y="165" font-family="system-ui,sans-serif" font-size="14" fill="#344966">Stage source object</text>
<path d="M526 149 h25" stroke="#31578b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="554" y="117" width="224" height="65" rx="8" fill="#ffffff" stroke="#879ebe"/>
<text x="566" y="143" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#111827">Amazon S3</text>
<text x="566" y="165" font-family="system-ui,sans-serif" font-size="14" fill="#344966">Upload staged file</text>
<path d="M778 149 h25" stroke="#31578b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="806" y="117" width="224" height="65" rx="8" fill="#ffffff" stroke="#879ebe"/>
<text x="818" y="143" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#111827">Destination check</text>
<text x="818" y="165" font-family="system-ui,sans-serif" font-size="14" fill="#344966">Compare byte counts</text>
<text x="30" y="237" font-family="system-ui,sans-serif" font-size="13" fill="#344966">Conceptual architecture · the transfer worker cleans up its staged file</text>
</svg>
